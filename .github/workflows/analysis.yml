name: Analysis checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s analysis/tests -v
      - name: Recalculate mission summaries
        run: |
          python analysis/deepseeker_analysis.py summarize data/M0014/source/telemetry.csv
          python analysis/deepseeker_analysis.py summarize data/M0016/source/telemetry.csv
